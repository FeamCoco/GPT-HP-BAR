name: CI

# 编译门禁：任意分支 push 与 PR 都编译一遍（release 配置 + 单测），只编译、不打包、不建 Release。
# 发版仍由 release.yml 在 `v*` 标签时负责：这里只声明 `branches`，按 GitHub 语义
# 该工作流对 tag 的 push 不触发（只有同时声明 branches 与 tags 时 tag 才会触发）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库不含 .cargo/config.toml（个人配置），CI 走默认 MSVC 工具链 —— 与 release.yml 一致
      - name: Build (release profile, no bundle)
        working-directory: app
        shell: pwsh
        run: cargo build --release

      # 单测复用上面的 release 产物（release profile），省掉一半重复编译
      - name: Unit tests (release profile)
        working-directory: app
        shell: pwsh
        run: cargo test --release

  # 前端动效/皮肤验收套件（tools/ 下的断言集）——此前只在人工跑，纳入门禁做长期回归保护。
  # 与 cargo 构建无关：ubuntu-latest 装好 node 依赖后跑一次纯 JS 校验。
  motion-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # tools/package-lock.json 的 resolved 指向 repo.huaweicloud.com 镜像，境外 runner 可能不可达。
      # 强制官方 registry（--replace-registry-host=always 才能覆盖 lock 里的镜像 host），
      # 并在 npm ci 失败时退化为 npm install —— 保证镜像不可达时也能装好依赖。
      - name: Install tools deps
        working-directory: tools
        shell: bash
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always || npm install --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Verify motion & skins
        working-directory: tools
        shell: bash
        run: npm run verify
