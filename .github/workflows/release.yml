name: Release

# 推送 v* 标签时自动编译 Release 版 exe 并创建对应的 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库不含 .cargo/config.toml（个人配置），CI 走默认 MSVC 工具链
      - name: Build release exe
        working-directory: app
        shell: pwsh
        run: cargo build --release

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $dir = "GPT-HP-BAR-${env:GITHUB_REF_NAME}-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item app/target/release/gpt-hp-bar.exe $dir/
          Copy-Item README.md, README_EN.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          gh release create "$env:GITHUB_REF_NAME" "$dir.zip" --title "$env:GITHUB_REF_NAME" --generate-notes
