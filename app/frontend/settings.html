<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GPT-HP-BAR 设置</title>
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="skins/card.css" />
  <link rel="stylesheet" href="skins/hero.css" />
  <link rel="stylesheet" href="skins/glass.css" />
  <link rel="stylesheet" href="skins/term.css" />
  <link rel="stylesheet" href="skins/tile.css" />
  <link rel="stylesheet" href="skins/battery.css" />
  <link rel="stylesheet" href="skins/gauge.css" />
  <link rel="stylesheet" href="skins/neon.css" />
  <link rel="stylesheet" href="skins/liquid.css" />
  <link rel="stylesheet" href="skins/pixel.css" />
</head>
<body>
  <main class="win">
    <header><span class="logo">⚡</span><h1 data-i18n="settings_title">GPT-HP-BAR 设置</h1><span class="ver">v0.3</span></header>

    <section>
      <h3 data-i18n="sec_lang">语言 / Language</h3>
      <div class="r"><span class="lab" data-i18n="lbl_lang">界面语言</span>
        <select id="lang">
          <option value="zh">简体中文</option>
          <option value="en">English</option>
        </select></div>
    </section>

    <section>
      <h3 data-i18n="sec_skin">皮肤</h3>
      <input type="hidden" id="skin">
      <div class="skin-grid" id="skin_grid"></div>
      <p class="tip" data-i18n="skin_tip">点击卡片即时换肤（深色底 = 悬浮窗完整形态 · 青色条 = 任务栏挂件形态）。</p>
    </section>

    <section>
      <h3 data-i18n="sec_appearance">外观与字体</h3>
      <div class="r"><span class="lab" data-i18n="lbl_font_scale">字号缩放</span>
        <input type="range" id="font_scale" min="80" max="150" step="5"><b id="font_scale_v">100%</b></div>
      <div class="r"><span class="lab" data-i18n="lbl_opacity">悬浮窗透明度</span>
        <input type="range" id="opacity" min="40" max="100" step="1"><b id="opacity_v">96%</b></div>
      <div class="r"><span class="lab" data-i18n="lbl_accent">主题色</span>
        <select id="accent">
          <option value="auto" data-i18n="accent_auto">跟随额度三档（绿 / 黄 / 红）</option>
          <option value="green" data-i18n="accent_green">固定绿</option>
          <option value="amber" data-i18n="accent_amber">固定琥珀</option>
          <option value="cyan" data-i18n="accent_cyan">固定青</option>
        </select></div>
    </section>

    <section>
      <h3 data-i18n="sec_content">显示内容</h3>
      <div class="checks">
        <label><input type="checkbox" id="show_week"> <span data-i18n="show_week">周窗口</span></label>
        <label><input type="checkbox" id="show_credits"> <span data-i18n="show_credits">credits 余额</span></label>
        <label><input type="checkbox" id="show_countdown"> <span data-i18n="show_countdown">重置倒计时</span></label>
        <label><input type="checkbox" id="show_email"> <span data-i18n="show_email">账号邮箱</span></label>
      </div>
    </section>

    <section>
      <h3 data-i18n="sec_taskbar">任务栏</h3>
      <label class="chk"><input type="checkbox" id="mini_enabled"> <span data-i18n="chk_mini">显示任务栏挂件（挂载到系统任务栏，自动避开托盘区与开始按钮）</span></label>
      <div class="r"><span class="lab" data-i18n="lbl_mini_pos">挂件位置</span>
        <select id="mini_pos">
          <option value="left" data-i18n="pos_left">靠左</option>
          <option value="center" data-i18n="pos_center">居中</option>
          <option value="right" data-i18n="pos_right">靠右（默认）</option>
        </select>
        <span class="val" data-i18n="mini_pos_note">位置冲突时自动移到最近空闲区</span></div>
    </section>

    <section>
      <h3 data-i18n="sec_behavior">行为</h3>
      <div class="r"><span class="lab" data-i18n="lbl_poll">刷新间隔</span>
        <select id="poll_secs">
          <option value="30" data-i18n="poll_30">30 秒</option>
          <option value="60" data-i18n="poll_60">60 秒</option>
          <option value="120" data-i18n="poll_120">2 分钟</option>
          <option value="300" data-i18n="poll_300">5 分钟</option>
          <option value="600" data-i18n="poll_600">10 分钟</option>
        </select></div>
      <label class="chk"><input type="checkbox" id="autostart"> <span data-i18n="chk_autostart">开机自启（用户级注册表，无需管理员）</span></label>
    </section>

    <section>
      <h3 data-i18n="sec_source">数据源</h3>
      <p class="src" id="src_info">读取中…</p>
      <button id="rescan" class="btn" data-i18n="btn_refresh">立即刷新数据</button>
      <p class="tip" data-i18n-html="src_tip_html">无数据源时：运行 <code>codex login</code> 完成 ChatGPT 登录后点"立即刷新"；
        中转需提供 wham/usage 兼容接口并设为 config.toml 的 model_provider。</p>
    </section>

    <footer>
      <span id="saved"></span>
      <button id="reset" class="btn ghost" data-i18n="btn_reset">恢复默认</button>
    </footer>
  </main>
  <script src="i18n.js"></script>
  <script src="skins/common.js"></script>
  <script src="skins/card.js"></script>
  <script src="skins/hero.js"></script>
  <script src="skins/glass.js"></script>
  <script src="skins/term.js"></script>
  <script src="skins/tile.js"></script>
  <script src="skins/battery.js"></script>
  <script src="skins/gauge.js"></script>
  <script src="skins/neon.js"></script>
  <script src="skins/liquid.js"></script>
  <script src="skins/pixel.js"></script>
  <script src="settings.js"></script>
</body>
</html>
